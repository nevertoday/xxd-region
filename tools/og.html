<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>og</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: #171612; color: #f3f0ea; font-family: "PingFang SC", "Avenir Next", sans-serif; position: relative; }
  .copy { position: absolute; left: 88px; top: 50%; transform: translateY(-54%); }
  h1 { font-weight: 600; line-height: 1.12; letter-spacing: -.01em; white-space: nowrap; display: inline-block; }
  h1 em { font-style: normal; color: #ff7a4d; }
  .sub { margin-top: 30px; font-size: 38px; font-weight: 500; color: #a7a194; }
  /* 右边：一枚硬币（本站标志：中间一个往左下指的箭头），落进下面一张银行卡 */
  .art { position: absolute; right: 110px; top: 150px; width: 260px; height: 340px; }
  .art svg { width: 100%; height: 100%; overflow: visible; }
  .brand { position: absolute; left: 88px; bottom: 56px; font-size: 26px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<div class="copy"><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
<div class="art"><svg viewBox="0 0 260 340" aria-hidden="true">
  <rect x="14" y="196" width="232" height="130" fill="none" stroke="#f3f0ea" stroke-width="14"/>
  <rect x="14" y="230" width="232" height="24" fill="#f3f0ea" opacity=".55"/>
  <rect x="44" y="282" width="64" height="14" fill="#f3f0ea"/>
  <circle cx="160" cy="92" r="78" fill="#ff7a4d"/>
  <path d="M192 60 L128 124 M128 76 V124 H176" fill="none" stroke="#171612" stroke-width="16" stroke-linejoin="miter" stroke-linecap="butt"/>
</svg></div>
<div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#f3f0ea"/><path d="M13.6 6.4 6.9 13.1M6.9 8.1V13.1H11.9" fill="none" stroke="#171612" stroke-width="2" stroke-linejoin="miter"/></svg><span id="brand"></span></div>
<script>
  // 定稿（2026-11-19）：标题问的就是读者的事（钱怎么收回国），副标题列出要讲的几家和 5 万美元额度
  const SUB = { zh: "PayPal · Wise · Payoneer · 5 万美元额度，一次讲清", en: "PayPal, Wise, Payoneer and the USD 50,000 quota, explained" };
  const BRAND = { zh: "跨境收款新手教程 · 非官方", en: "Getting paid from abroad · unofficial" };
  const COPY = {
    zh: "海外的钱<br><em>怎么收回国</em>",
    en: "Getting paid<br>from <em>abroad</em>",
  };
  const q = new URLSearchParams(location.search);
  const lang = q.get("lang") === "en" ? "en" : "zh";
  const h1 = document.getElementById("h1");
  h1.innerHTML = COPY[lang];
  if (lang === "en") { h1.style.fontFamily = '"Avenir Next", sans-serif'; h1.style.fontWeight = "800"; }
  document.getElementById("sub").textContent = SUB[lang];
  document.getElementById("brand").textContent = BRAND[lang];
  let size = 128;
  h1.style.fontSize = size + "px";
  while (h1.getBoundingClientRect().width > 740 && size > 60) h1.style.fontSize = (size -= 2) + "px";
  const sub = document.getElementById("sub");
  sub.style.whiteSpace = "nowrap"; sub.style.display = "inline-block";
  let ss = 34; sub.style.fontSize = ss + "px";
  while (sub.getBoundingClientRect().width > 740 && ss > 22) sub.style.fontSize = (ss -= 1) + "px";
</script>
</body>
</html>
