<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="792" viewBox="0 0 1200 792" role="img" aria-label="Before your main account changes region, Apple asks you to clear these: Balance: Spend your Apple Account balance; Apple Support can clear an amount too small to buy anything. Subscriptions: Cancel the ones that block the change, then wait for the period to end. Pending items: Memberships, pre-orders, movie rentals, season passes and refunds still processing. Family Sharing: A member of a Family Sharing group might not be able to change region. Payment method: You might need one that works in the new country or region. What you bought: Some content might not be available in the new region, so download it first. China mainland accounts: one more: iCloud content moves from GCBD to Apple, and GCBD then deletes its copy. So a second account is simpler. Sources: Apple Support 118283 and 111754, the iCloud (operated by GCBD) terms"><style>@keyframes k0{0%,4.00%{opacity:0}7.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k0{animation:k0 10.0s infinite}@keyframes k1{0%,11.00%{opacity:0}14.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k1{animation:k1 10.0s infinite}@keyframes k2{0%,18.00%{opacity:0}21.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k2{animation:k2 10.0s infinite}@keyframes k3{0%,25.00%{opacity:0}28.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k3{animation:k3 10.0s infinite}@keyframes k4{0%,32.00%{opacity:0}35.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k4{animation:k4 10.0s infinite}@keyframes k5{0%,39.00%{opacity:0}42.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k5{animation:k5 10.0s infinite}@keyframes gc{0%,48.00%{opacity:0}52.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.gc{animation:gc 10.0s infinite}@keyframes end{0%,58.00%{opacity:0}62.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.end{animation:end 10.0s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="792" fill="#171612"/><text x="40" y=