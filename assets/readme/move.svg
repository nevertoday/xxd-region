d"><rect x="40" y="672" width="8" height="34" fill="#ff7a4d"/><text x="64" y="698" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#f3f0ea" text-anchor="start">所以，另注册一个外区账户更省事</text></g><text x="40" y="740" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="400" fill="#a7a194" text-anchor="start">出处：Apple 支持 118283、111754，云上贵州运营的 iCloud 条款</text></svg>
