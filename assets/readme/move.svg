<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="766" viewBox="0 0 1200 766" role="img" aria-label="给主账户换地区之前，Apple 要你先清掉这些: 余额: 把 Apple 账户余额用完；不够买一件东西的零头，找 Apple 支持清零. 订阅: 取消会挡住换区的订阅，再等到订阅期结束. 待处理的事: 会员资格、预购、影片租借、季票，还有没处理完的退款. 家人共享: 在家人共享群组里的成员，可能换不了地区. 付款方式: 可能要填一个新地区能用的付款方式. 已买的内容: 有些内容到了新地区可能用不了，先下载到要用的设备上. 国区账户还多一件: iCloud 里的内容会从云上贵州迁到 Apple，迁完以后云上贵州删掉它那份. 所以，另注册一个外区账户更省事. 出处：Apple 支持 118283、111754，云上贵州运营的 iCloud 条款"><style>@keyframes k0{0%,4.00%{opacity:0}7.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k0{animation:k0 10.0s infinite}@keyframes k1{0%,11.00%{opacity:0}14.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k1{animation:k1 10.0s infinite}@keyframes k2{0%,18.00%{opacity:0}21.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k2{animation:k2 10.0s infinite}@keyframes k3{0%,25.00%{opacity:0}28.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k3{animation:k3 10.0s infinite}@keyframes k4{0%,32.00%{opacity:0}35.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k4{animation:k4 10.0s infinite}@keyframes k5{0%,39.00%{opacity:0}42.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.k5{animation:k5 10.0s infinite}@keyframes gc{0%,48.00%{opacity:0}52.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.gc{animation:gc 10.0s infinite}@keyframes end{0%,58.00%{opacity:0}62.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.end{animation:end 10.0s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="1200" height="766" fill="#171612"/><text x="40" y="52" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#f3f0ea" text-anchor="start">给主账户换地区之前，Apple 要你先清掉这些</text><rect x="40" y="84" width="1120" height="68" fill="#211f1a" stroke="#3a372f" stroke-width="2"/><text x="64" y="122" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#f3f0ea" text-anchor="start">余额</text><text x="214" y="122" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#a7a194" text-anchor="start">把 Apple 账户余额用完；不够买一件东西的零头，找 Apple 支持清零</text><g class="k0"><rect x="1106" y="103" width="30" height="30" fill="#ff7a4d"/><path d="M1113.2 118.6 l6.0 6.0 l10.2 -11.4" stroke="#171612" stroke-width="3.6" fill="none"/></g><rect x="40" y="162" width="1120" height="68" fill="#211f1a" stroke="#3a372f" stroke-width="2"/><text x="64" y="200" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#f3f0ea" text-anchor="start">订阅</text><text x="214" y="200" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#a7a194" text-anchor="start">取消会挡住换区的订阅，再等到订阅期结束</text><g class="k1"><rect x="1106" y="181" width="30" height="30" fill="#ff7a4d"/><path d="M1113.2 196.6 l6.0 6.0 l10.2 -11.4" stroke="#171612" stroke-width="3.6" fill="none"/></g><rect x="40" y="240" width="1120" height="68" fill="#211f1a" stroke="#3a372f" stroke-width="2"/><text x="64" y="278" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#f3f0ea" text-anchor="start">待处理的事</text><text x="214" y="278" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#a7a194" text-anchor="start">会员资格、预购、影片租借、季票，还有没处理完的退款</text><g class="k2"><rect x="1106" y="259" width="30" height="30" fill="#ff7a4d"/><path d="M1113.2 274.6 l6.0 6.0 l10.2 -11.4" stroke="#171612" stroke-width="3.6" fill="none"/></g><rect x="40" y="318" width="1120" height="68" fill="#211f1a" stroke="#3a372f" stroke-width="2"/><text x="64" y="356" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#f3f0ea" text-anchor="start">家人共享</text><text x="214" y="356" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="500" fill="#a7a194" text-anchor="sta